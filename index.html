<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a84c6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حسابات المياه">
<title>حسابات المياه</title>
<style>
:root{--bg:#f3f7fb;--card:#fff;--tx:#12263a;--mu:#6b7c8d;--pr:#0a84c6;--ok:#1a9d5a;--bad:#d94b4b;--bd:#e1e8ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--card:#172331;--tx:#e8f0f7;--mu:#8fa3b5;--bd:#25364a}}
:root[data-theme="dark"]{--bg:#0e1620;--card:#172331;--tx:#e8f0f7;--mu:#8fa3b5;--bd:#25364a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:560px;margin:auto;padding:12px}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
button{padding:10px 12px;border:0;border-radius:10px;background:var(--pr);color:#fff;font-size:15px;cursor:pointer}
button.g{background:var(--ok)}button.r{background:var(--bad)}button.l{background:var(--bd);color:var(--tx)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:var(--pr);color:#fff}
.stat{text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mu)}
.res{background:var(--bg);border-radius:10px;padding:10px;margin:10px 0;text-align:center}
.res b{font-size:22px;color:var(--pr)}
.badge{font-size:12px;padding:2px 8px;border-radius:20px;color:#fff}
.badge.p{background:var(--ok)}.badge.u{background:var(--bad)}
.item{border-top:1px solid var(--bd);padding:10px 0}
.item:first-child{border-top:0}
.sm{font-size:13px;color:var(--mu)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.acts button{padding:7px 10px;font-size:13px}
.hide{display:none}
input[type=file]{font-size:13px;padding:8px}
.phs{display:flex;gap:8px;margin-top:8px}.phs>div{flex:1}.phs img{width:100%;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}th,td{padding:7px 3px;text-align:center;border-top:1px solid var(--bd)}th{color:var(--mu);font-weight:normal}td:first-child,th:first-child{text-align:right}
</style>
</head>
<body>
<h1>💧 حسابات تعبئة المياه</h1>

<div class="row" style="margin-bottom:10px">
  <div class="card stat"><b id="sU">0</b><span>غير واصل (₪)</span></div>
  <div class="card stat"><b id="sP">0</b><span>واصل (₪)</span></div>
  <div class="card stat"><b id="sC">0</b><span>زبائن عليهم</span></div>
</div>

<div class="tabs">
  <button id="t1" class="on" onclick="tab(1)">تعبئة</button>
  <button id="t2" onclick="tab(2)">السجل</button>
  <button id="t3" onclick="tab(3)">الزبائن</button>
  <button id="t4" onclick="tab(4)">تقارير</button>
</div>

<!-- جديد -->
<div id="v1">
  <div class="card">
    <label>الزبون</label>
    <select id="cust" onchange="fillBefore()"></select>
    <div class="row" style="margin-top:8px">
      <div><label>قراءة قبل</label><input id="bef" type="number" inputmode="decimal" oninput="calc()"><button id="rb" class="l hide" style="width:100%;margin-top:6px;padding:6px;font-size:13px" onclick="readMeter('b')">📷 اقرأ من الصورة</button><div class="sm" id="sb"></div></div>
      <div><label>قراءة بعد</label><input id="aft" type="number" inputmode="decimal" oninput="calc()"><button id="ra" class="l hide" style="width:100%;margin-top:6px;padding:6px;font-size:13px" onclick="readMeter('a')">📷 اقرأ من الصورة</button><div class="sm" id="sa"></div></div>
    </div>
    <div class="row" style="margin-top:8px">
      <div><label>سعر الكيلو (₪)</label><input id="price" type="number" inputmode="decimal" step="0.01" oninput="calc()"></div>
      <div><label>التاريخ</label><input id="dt" type="date"></div>
    </div>
    <div class="row" style="margin-top:8px"><div><label>📷 صورة العداد قبل</label><input id="pb" type="file" accept="image/*"></div><div><label>📷 صورة العداد بعد</label><input id="pa" type="file" accept="image/*"></div></div>
    <div class="res"><span class="sm">الكمية: <b id="qty" style="font-size:16px;color:var(--tx)">0</b> كيلو</span><br>المبلغ: <b id="tot">0</b> ₪</div>
    <button style="width:100%" onclick="save()">حفظ التعبئة</button>
  </div>
</div>

<!-- سجل -->
<div id="v2" class="hide">
  <div class="card">
    <div class="row">
      <select id="fc" onchange="renderLog()"><option value="">كل الزبائن</option></select>
      <select id="fs" onchange="renderLog()"><option value="">الكل</option><option value="u">غير واصل</option><option value="p">واصل</option></select>
    </div>
  </div>
  <div class="card" id="log"></div>
</div>

<!-- زبائن -->
<div id="v3" class="hide">
  <div class="card">
    <label>إضافة زبون</label>
    <div class="row"><input id="nn" placeholder="الاسم"><input id="np" placeholder="رقم الجوال 059..." inputmode="tel"></div>
    <button style="width:100%;margin-top:8px" onclick="addC()">إضافة</button>
  </div>
  <div class="card" id="clist"></div>
  <div class="card">
    <label>سعر الكيلو الافتراضي (₪)</label>
    <input id="dp" type="number" inputmode="decimal" step="0.01" onchange="setDP()">
  </div>
</div>

<!-- تقارير -->
<div id="v4" class="hide">
  <div class="card"><label>الشهر</label><input id="rm" type="month" onchange="renderRep()"></div>
  <div class="card" id="rep"></div>
  <button class="l" style="width:100%" onclick="cpRep()">نسخ التقرير</button>
</div>

<script>
var D={customers:[],entries:[],price:0.5};
var db;
function idb(){return new Promise(function(res,rej){if(db)return res(db);try{var r=indexedDB.open("waterph",1);r.onupgradeneeded=function(){r.result.createObjectStore("p")};r.onsuccess=function(){db=r.result;res(db)};r.onerror=function(){rej()}}catch(x){rej()}})}
function putP(k,v){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction("p","readwrite");t.objectStore("p").put(v,k);t.oncomplete=res;t.onerror=rej})})}
function getP(k){return idb().then(function(d){return new Promise(function(res,rej){var q=d.transaction("p").objectStore("p").get(k);q.onsuccess=function(){res(q.result)};q.onerror=rej})})}
function delP(k){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction("p","readwrite");t.objectStore("p").delete(k);t.oncomplete=res;t.onerror=rej})})}
function shrink(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.6))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function savePh(k,f){return shrink(f).then(function(u){return putP(k,u)})}
function showPh(id){var b=$("ph_"+id);if(b.innerHTML){b.innerHTML="";return}
  Promise.all([getP(id+"b"),getP(id+"a")]).then(function(r){var h="";if(r[0])h+='<div><div class="sm">قبل</div><img src="'+r[0]+'"></div>';if(r[1])h+='<div><div class="sm">بعد</div><img src="'+r[1]+'"></div>';b.innerHTML=h?'<div class="phs">'+h+'</div>':'<div class="sm">ما في صور لهاي التعبئة</div>'}).catch(function(){b.innerHTML='<div class="sm">تعذر عرض الصور</div>'})}
function f(n){return +n.toFixed(2)}
var SM=null;
function initRead(){try{if(window.claude&&claude.use)claude.use("sample").then(function(s){if(s){SM=s;$("rb").classList.remove("hide");$("ra").classList.remove("hide")}},function(){})}catch(x){}}
function shrinkBlob(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){b?res(b):rej()},"image/jpeg",0.85)};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function readMeter(k){var inp=$(k==="b"?"pb":"pa"),tg=$(k==="b"?"bef":"aft"),st=$(k==="b"?"sb":"sa");
  if(!SM)return;
  if(!inp.files[0]){st.textContent="اختار صورة العداد أولاً من فوق";return}
  st.textContent="جاري القراءة...";
  try{var lm=await SM.limits();if(!lm||!lm.images){st.textContent="قراءة الصور غير متاحة";return}
    var bl=await shrinkBlob(inp.files[0]);
    var r=await SM("هذه صورة لعداد مياه رقمي. اقرأ الرقم الظاهر على شاشة العداد (القراءة الكلية). ردّ بالرقم فقط بالأرقام الإنجليزية 0-9 مع الفاصلة العشرية إن وجدت، بدون أي كلام أو وحدات. إذا ما قدرت تقراه بوضوح ردّ بكلمة: unclear",{images:[bl],modelTier:"default",cache:false});
    var m=(r.text||"").replace(/,/g,".").match(/\d+(\.\d+)?/);
    if(!m){st.textContent="ما قدرت أقرأ الرقم، اكتبه يدوي أو صوّر مرة ثانية";return}
    tg.value=m[0];calc();st.textContent="قرأت: "+m[0]+" — تأكد منه من الصورة ✅"
  }catch(e){var c=e&&e.code;st.textContent=c==="not_granted"?"لازم توافق على استخدام Claude":c==="rate_limited"?"كثرت الطلبات، جرب بعد شوي":c==="image_rejected"?"الصورة ما انقبلت، جرب صورة ثانية":"صار خطأ، اكتب الرقم يدوي"}}
function repData(){var m=$("rm").value,by={},l=D.entries.filter(function(e){return e.date&&e.date.slice(0,7)===m});
  l.forEach(function(e){var o=by[e.c]||(by[e.c]={q:0,t:0,p:0,n:0});o.q+=e.qty;o.t+=e.tot;o.n++;if(e.paid)o.p+=e.tot});return by}
function renderRep(){if(!$("rm").value)$("rm").value=new Date().toISOString().slice(0,7);
  var by=repData(),Q=0,T=0,P=0,N=0,rows=Object.keys(by).map(function(c){var o=by[c];Q+=o.q;T+=o.t;P+=o.p;N+=o.n;return '<tr><td>'+esc(cn(c))+'</td><td>'+f(o.q)+'</td><td>'+f(o.t)+'</td><td style="color:var(--ok)">'+f(o.p)+'</td><td style="color:var(--bad)">'+f(o.t-o.p)+'</td></tr>'}).join("");
  if(!rows){$("rep").innerHTML='<div class="sm" style="text-align:center">ما في تعبئات بهذا الشهر</div>';return}
  $("rep").innerHTML='<div class="row stat"><div><b>'+N+'</b><span>تعبئة</span></div><div><b>'+f(Q)+'</b><span>كيلو</span></div><div><b>'+f(T)+'</b><span>الإجمالي ₪</span></div></div><div class="row stat" style="margin-top:10px"><div><b style="color:var(--ok)">'+f(P)+'</b><span>واصل ₪</span></div><div><b style="color:var(--bad)">'+f(T-P)+'</b><span>باقي ₪</span></div></div>'+
  '<table><tr><th>الزبون</th><th>كيلو</th><th>المبلغ</th><th>واصل</th><th>باقي</th></tr>'+rows+'</table>'}
function cpRep(){var by=repData(),t="تقرير شهر "+$("rm").value+"\n",T=0,P=0;
  Object.keys(by).forEach(function(c){var o=by[c];T+=o.t;P+=o.p;t+=cn(c)+": "+f(o.q)+" كيلو، "+f(o.t)+" ₪، باقي "+f(o.t-o.p)+" ₪\n"});
  t+="الإجمالي: "+f(T)+" ₪ | واصل: "+f(P)+" ₪ | باقي: "+f(T-P)+" ₪";
  try{navigator.clipboard.writeText(t).then(function(){alert("تم نسخ التقرير")},function(){prompt("انسخ التقرير",t)})}catch(x){prompt("انسخ التقرير",t)}}
function load(){try{var s=localStorage.getItem("water1");if(s)D=JSON.parse(s)}catch(e){}}
function store(){try{localStorage.setItem("water1",JSON.stringify(D))}catch(e){}}
function $(i){return document.getElementById(i)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function cn(id){var c=D.customers.find(function(x){return x.id===id});return c?c.name:"?"}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function tab(n){for(var i=1;i<=4;i++){$("v"+i).classList.toggle("hide",i!==n);$("t"+i).classList.toggle("on",i===n)}
  if(n===2)renderLog();if(n===3)renderC();if(n===4)renderRep()}
function opts(){var h="";D.customers.forEach(function(c){h+='<option value="'+c.id+'">'+esc(c.name)+'</option>'});
  $("cust").innerHTML=h||'<option value="">أضف زبون أولاً</option>';
  $("fc").innerHTML='<option value="">كل الزبائن</option>'+h}
function lastAfter(id){var l=D.entries.filter(function(e){return e.c===id});return l.length?l[l.length-1].aft:""}
function fillBefore(){$("bef").value=lastAfter($("cust").value);calc()}
function calc(){var q=(parseFloat($("aft").value)||0)-(parseFloat($("bef").value)||0);if(q<0)q=0;
  $("qty").textContent=+q.toFixed(2);$("tot").textContent=+(q*(parseFloat($("price").value)||0)).toFixed(2)}
function save(){var c=$("cust").value;if(!c){alert("أضف زبون أولاً");return}
  var b=parseFloat($("bef").value),a=parseFloat($("aft").value),p=parseFloat($("price").value);
  if(isNaN(b)||isNaN(a)||isNaN(p)||a<b){alert("تأكد من القراءات (البعد لازم يكون أكبر من القبل) والسعر");return}
  var q=a-b;var id=uid();D.entries.push({id:id,c:c,bef:b,aft:a,price:p,qty:q,tot:+(q*p).toFixed(2),date:$("dt").value,paid:false});
  store();var ps=[],fb=$("pb").files[0],fa=$("pa").files[0];if(fb)ps.push(savePh(id+"b",fb));if(fa)ps.push(savePh(id+"a",fa));
  Promise.all(ps).then(function(){$("pb").value="";$("pa").value="";alert("تم الحفظ ✅")},function(){$("pb").value="";$("pa").value="";alert("انحفظت التعبئة بس الصور ما انحفظت")});
  $("aft").value="";fillBefore();refresh()}
function msg(e){return "السلام عليكم "+cn(e.c)+"،\nتعبئة المياه بتاريخ "+e.date+" ("+(+e.qty.toFixed(2))+" كيلو × "+e.price+")\nعليك مبلغ: "+e.tot+" ₪\nيعطيك العافية 🌹"}
function wa(id){var e=D.entries.find(function(x){return x.id===id});var c=D.customers.find(function(x){return x.id===e.c});
  var ph=(c.phone||"").replace(/\D/g,"");if(ph.indexOf("0")===0)ph="970"+ph.slice(1);
  window.open("https://wa.me/"+ph+"?text="+encodeURIComponent(msg(e)),"_blank")}
function cp(id){var e=D.entries.find(function(x){return x.id===id});
  try{navigator.clipboard.writeText(msg(e)).then(function(){alert("تم نسخ الرسالة")},function(){prompt("انسخ الرسالة",msg(e))})}catch(x){prompt("انسخ الرسالة",msg(e))}}
function pay(id){var e=D.entries.find(function(x){return x.id===id});e.paid=!e.paid;store();refresh();renderLog()}
function del(id){if(!confirm("حذف هذا السجل؟"))return;delP(id+"b").catch(function(){});delP(id+"a").catch(function(){});D.entries=D.entries.filter(function(x){return x.id!==id});store();refresh();renderLog()}
function renderLog(){var c=$("fc").value,s=$("fs").value;
  var l=D.entries.filter(function(e){return(!c||e.c===c)&&(!s||(s==="p")===e.paid)}).slice().reverse();
  if(!l.length){$("log").innerHTML='<div class="sm" style="text-align:center">ما في سجلات</div>';return}
  $("log").innerHTML=l.map(function(e){return '<div class="item"><div class="row"><b>'+esc(cn(e.c))+'</b><span style="text-align:left"><span class="badge '+(e.paid?"p":"u")+'">'+(e.paid?"واصل":"غير واصل")+'</span></span></div>'+
   '<div class="sm">'+e.date+' · '+e.bef+' ← '+e.aft+' · '+(+e.qty.toFixed(2))+' كيلو × '+e.price+'</div>'+
   '<div><b>'+e.tot+' ₪</b></div><div class="acts"><button class="'+(e.paid?"l":"g")+'" onclick="pay(\''+e.id+'\')">'+(e.paid?"إلغاء الدفع":"تم الدفع")+'</button>'+
   '<button onclick="wa(\''+e.id+'\')">واتساب</button><button class="l" onclick="cp(\''+e.id+'\')">نسخ الرسالة</button><button class="l" onclick="showPh(\''+e.id+'\')">📷 الصور</button><button class="r" onclick="del(\''+e.id+'\')">حذف</button></div><div id="ph_'+e.id+'"></div></div>'}).join("")}
function addC(){var n=$("nn").value.trim();if(!n)return;D.customers.push({id:uid(),name:n,phone:$("np").value.trim()});
  $("nn").value="";$("np").value="";store();opts();renderC();fillBefore()}
function delC(id){if(D.entries.some(function(e){return e.c===id})){alert("عند الزبون سجلات، ما بينفع تحذفه");return}
  D.customers=D.customers.filter(function(c){return c.id!==id});store();opts();renderC()}
function renderC(){$("dp").value=D.price;
  if(!D.customers.length){$("clist").innerHTML='<div class="sm" style="text-align:center">ما في زبائن</div>';return}
  $("clist").innerHTML=D.customers.map(function(c){var d=D.entries.filter(function(e){return e.c===c.id&&!e.paid}).reduce(function(s,e){return s+e.tot},0);
   return '<div class="item row"><div><b>'+esc(c.name)+'</b><div class="sm">'+esc(c.phone||"")+'</div></div><div style="text-align:center"><b style="color:'+(d?'var(--bad)':'var(--ok)')+'">'+(+d.toFixed(2))+' ₪</b><div class="sm">عليه</div></div><div style="flex:0"><button class="r" onclick="delC(\''+c.id+'\')">✕</button></div></div>'}).join("")}
function setDP(){D.price=parseFloat($("dp").value)||0;store();$("price").value=D.price;calc()}
function refresh(){var u=0,p=0,cs={};D.entries.forEach(function(e){if(e.paid)p+=e.tot;else{u+=e.tot;cs[e.c]=1}});
  $("sU").textContent=+u.toFixed(2);$("sP").textContent=+p.toFixed(2);$("sC").textContent=Object.keys(cs).length}
initRead();load();$("dt").value=new Date().toISOString().slice(0,10);$("price").value=D.price;opts();fillBefore();refresh();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
